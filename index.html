<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日文假名發音測驗</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap');
  
  body {
    font-family: 'Plus Jakarta Sans', 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    padding-top: env(safe-area-inset-top, 12px);
    padding-bottom: env(safe-area-inset-bottom, 12px);
  }
  
  /* 精緻玻璃擬態效果 */
  .glass-panel {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.6);
  }

  .glass-card {
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.8);
    box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05), 0 0 15px rgba(99, 102, 241, 0.05);
  }

  /* 調整發音按鈕波紋視覺 */
  .audio-pulse {
    animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }
  
  @keyframes pulse-ring {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.8; }
  }
</style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-indigo-50/50 to-slate-200 h-screen w-screen overflow-hidden flex flex-col justify-between p-3 sm:p-5 text-slate-800 select-none">

  <!-- 頂部提示（App 內建瀏覽器環境警示） -->
  <div id="env-warning" class="hidden max-w-md mx-auto w-full mb-1.5 p-2 bg-amber-500/10 border border-amber-500/30 rounded-xl text-center backdrop-blur-md shrink-0">
    <p class="text-xs font-bold text-amber-900 flex items-center justify-center gap-1.5">
      <i class="fa-solid fa-triangle-exclamation text-amber-600"></i> 偵測到 App 內置視窗
    </p>
    <p class="text-[11px] text-amber-800/90 mt-0.5">
      請點選右上角 <span class="font-extrabold text-amber-900">「...」</span> 選擇 <span class="font-extrabold text-indigo-600">「在 Safari/Chrome 中開啟」</span>
    </p>
  </div>

  <div class="max-w-md mx-auto w-full h-full flex flex-col justify-between overflow-hidden gap-2">
    
    <!-- Header 頁頭與模式切換 -->
    <header class="w-full space-y-2 shrink-0">
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black shadow-md shadow-indigo-200 text-base">
            あ
          </div>
          <div>
            <h1 class="text-base font-black tracking-tight text-slate-800 leading-tight">
              假名發音特訓
            </h1>
            <p class="text-[10px] font-bold text-slate-400">標準東京腔語音校正</p>
          </div>
        </div>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-indigo-50/80 text-indigo-600 border border-indigo-100/80 shadow-xs">
          <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-ping"></span> 東京腔 AI 音訊
        </span>
      </div>

      <!-- 模式選單 Toggle -->
      <div class="p-1 bg-slate-200/60 backdrop-blur-md rounded-xl flex text-xs font-bold gap-1 shadow-inner border border-white/40">
        <button id="mode-b" onclick="switchMode('B')" class="flex-1 py-1.5 rounded-lg transition-all duration-200 bg-white text-indigo-600 shadow-sm font-black">
          聽音辨字
        </button>
        <button id="mode-review" onclick="switchMode('REVIEW')" class="flex-1 py-1.5 rounded-lg transition-all duration-200 text-slate-500 hover:text-slate-800 flex items-center justify-center gap-1">
          錯題複習
          <span id="review-count" class="bg-rose-500 text-white text-[9px] px-1.5 py-0.2 rounded-full font-black min-w-[16px]">0</span>
        </button>
      </div>

      <!-- 假名種類選單 (平假名 / 片假名 / 混合) -->
      <div class="p-1 bg-slate-100/80 rounded-xl flex text-[11px] font-extrabold gap-1 border border-slate-200/80">
        <button id="type-hira" onclick="switchKanaType('hira')" class="flex-1 py-1 rounded-lg transition-all text-center bg-indigo-600 text-white shadow-xs">
          平假名 (あ)
        </button>
        <button id="type-kata" onclick="switchKanaType('kata')" class="flex-1 py-1 rounded-lg transition-all text-center text-slate-600 hover:text-slate-900">
          片假名 (ア)
        </button>
        <button id="type-both" onclick="switchKanaType('both')" class="flex-1 py-1 rounded-lg transition-all text-center text-slate-600 hover:text-slate-900">
          平＋片 混合
        </button>
      </div>

      <!-- 音類篩選 (清音 / 濁音與半濁音 / 全部) -->
      <div class="p-1 bg-slate-200/50 rounded-xl flex text-[10px] font-extrabold gap-1 border border-slate-200/50">
        <button id="category-sei" onclick="switchCategory('sei')" class="flex-1 py-1 rounded-md transition-all text-center bg-white text-indigo-600 shadow-2xs font-black">
          清音 (あ/ア)
        </button>
        <button id="category-daku" onclick="switchCategory('daku')" class="flex-1 py-1 rounded-md transition-all text-center text-slate-600 hover:text-slate-900">
          濁音・半濁音 (が/ぱ)
        </button>
        <button id="category-all" onclick="switchCategory('all')" class="flex-1 py-1 rounded-md transition-all text-center text-slate-600 hover:text-slate-900">
          全部音標
        </button>
      </div>

      <!-- 計分資訊數據卡 -->
      <div class="grid grid-cols-2 gap-2">
        <div class="glass-panel px-3 py-1.5 rounded-xl flex items-center justify-between shadow-xs">
          <span class="text-[11px] font-bold text-slate-500 flex items-center gap-1.5">
            <i class="fa-solid fa-circle-check text-emerald-500 text-xs"></i> 答對題數
          </span>
          <span class="text-xs font-black text-slate-800">
            <span id="score-correct" class="text-emerald-600 text-sm">0</span> <span class="text-slate-400">/</span> <span id="score-total">0</span>
          </span>
        </div>
        <div class="glass-panel px-3 py-1.5 rounded-xl flex items-center justify-between shadow-xs">
          <span class="text-[11px] font-bold text-slate-500 flex items-center gap-1.5">
            <i class="fa-solid fa-chart-pie text-indigo-500 text-xs"></i> 正確勝率
          </span>
          <span id="score-accuracy" class="text-xs font-black text-indigo-600">0%</span>
        </div>
      </div>
    </header>

    <!-- 主卡片展示區 -->
    <main class="flex-1 flex flex-col justify-center min-h-0 overflow-hidden relative my-0.5">
      <div class="glass-card rounded-2xl p-3.5 sm:p-5 text-center flex flex-col justify-between items-center relative h-full w-full overflow-y-auto">
        
        <p id="prompt-text" class="text-[11px] font-extrabold text-slate-400 tracking-wider uppercase shrink-0">
          請聽標準發音，選擇正確假名
        </p>
        
        <!-- 假名/喇叭展示 -->
        <div class="my-auto py-1 flex flex-col items-center justify-center">
          <button onclick="playCurrentAudio()" class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-indigo-50 hover:bg-indigo-100/80 border border-indigo-100 flex flex-col items-center justify-center text-indigo-600 shadow-sm active:scale-95 transition-all gap-1 group cursor-pointer audio-pulse">
            <i class="fa-solid fa-volume-high text-2xl sm:text-3xl text-indigo-500 group-hover:scale-110 transition-transform"></i>
            <span class="text-[10px] font-extrabold text-indigo-400">點擊播放</span>
          </button>

          <!-- 答題後顯示羅馬拼音提示 -->
          <div id="roma-display" class="hidden mt-2.5 inline-flex items-center px-3 py-0.5 rounded-full bg-slate-100 border border-slate-200 text-slate-600 text-xs font-extrabold tracking-wider">
            [ a ]
          </div>
        </div>

        <!-- 4 選項網格 -->
        <div id="options-container" class="w-full grid grid-cols-2 gap-2 mt-1 shrink-0"></div>

        <!-- 狀態與辨識結果提示 -->
        <div class="w-full min-h-[28px] flex flex-col items-center justify-center text-center mt-1 shrink-0">
          <div id="feedback-text" class="text-xs font-black transition-all"></div>
        </div>
      </div>
    </main>

    <!-- 底部操作區 -->
    <footer class="w-full space-y-1.5 shrink-0">
      
      <!-- 功能按鈕：重播與下一題 -->
      <div class="grid grid-cols-2 gap-2">
        <button id="btn-play-audio" onclick="playCurrentAudio()" class="py-2.5 px-3 text-xs font-extrabold bg-white hover:bg-slate-50 text-slate-700 border border-slate-200/80 rounded-xl shadow-xs active:scale-95 transition-all flex items-center justify-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-volume-high text-indigo-500"></i> 再聽一次
        </button>
        <button id="btn-next-question" onclick="nextQuestion()" class="py-2.5 px-3 text-xs font-extrabold bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-md shadow-indigo-200 active:scale-95 transition-all flex items-center justify-center gap-1.5 cursor-pointer">
          下一題 <i class="fa-solid fa-arrow-right text-[10px]"></i>
        </button>
      </div>

      <p class="text-center text-[9px] font-bold text-slate-400">
        日語五十音聽力測驗（標準東京腔）
      </p>
    </footer>
  </div>

  <audio id="tts-audio-player" class="hidden" playsinline></audio>

  <script>

    ];

    // 清音（片假名）
    const KATAKANA_SEION = [
      { kana: 'ア', roma: 'a', type: 'kata', cat: 'sei' }, { kana: 'イ', roma: 'i', type: 'kata', cat: 'sei' }, { kana: 'ウ', roma: 'u', type: 'kata', cat: 'sei' }, { kana: 'エ', roma: 'e', type: 'kata', cat: 'sei' }, { kana: 'オ', roma: 'o', type: 'kata', cat: 'sei' },

    let currentKanaType = 'hira';
    let currentCategory = 'sei';

    let currentQuestion = null;
    let correctCount = 0;

    // 語音引擎與東京腔 Voice 物件
    let synth = window.speechSynthesis;
    let selectedTokyoVoice = null;
    let ttsUnlocked = false;

    // 篩選最優質的東京腔/標準日語發音包
    function initTokyoVoice() {
      if (!synth) return;
      const voices = synth.getVoices();
      
      // 日本語語音搜尋順序（包含 Apple, Microsoft, Google 的高品質東京腔）
      const preferredVoices = [
        'Kyoko', 'Otoya', 'Hattori', 'Sora', 'Nanami', 'Keita',
        'Google 日本語', 'Japan', 'ja-JP', 'ja_JP'
      ];

      for (let pref of preferredVoices) {
        const found = voices.find(v => v.lang.includes('ja') && v.name.toLowerCase().includes(pref.toLowerCase()));
        if (found) {
          selectedTokyoVoice = found;
          break;
        }
      }

      if (!selectedTokyoVoice) {
        selectedTokyoVoice = voices.find(v => v.lang.startsWith('ja'));
      }
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = initTokyoVoice;
    }

    function getActiveDataset() {
      let pool = [];
      if (currentKanaType === 'hira') pool = HIRAGANA_DATA;
      else if (currentKanaType === 'kata') pool = KATAKANA_DATA;
      else pool = [...HIRAGANA_DATA, ...KATAKANA_DATA];

      if (currentCategory === 'sei') {
        return pool.filter(item => item.cat === 'sei');
      } else if (currentCategory === 'daku') {
        return pool.filter(item => item.cat === 'daku' || item.cat === 'handaku');
      }
      return pool;
    }

    function switchKanaType(type) {
      if (currentKanaType === type) return;
      currentKanaType = type;

      const btnHira = document.getElementById('type-hira');
      const btnKata = document.getElementById('type-kata');
      const btnBoth = document.getElementById('type-both');

      [btnHira, btnKata, btnBoth].forEach(btn => {
        btn.className = "flex-1 py-1 rounded-lg transition-all text-center text-slate-600 hover:text-slate-900";
      });

      if (type === 'hira') btnHira.className = "flex-1 py-1 rounded-lg transition-all text-center bg-indigo-600 text-white shadow-xs font-bold";
      if (type === 'kata') btnKata.className = "flex-1 py-1 rounded-lg transition-all text-center bg-indigo-600 text-white shadow-xs font-bold";
      if (type === 'both') btnBoth.className = "flex-1 py-1 rounded-lg transition-all text-center bg-indigo-600 text-white shadow-xs font-bold";

      nextQuestion();
    }

    function switchCategory(cat) {
      if (currentCategory === cat) return;
      currentCategory = cat;

      const btnSei = document.getElementById('category-sei');
      const btnDaku = document.getElementById('category-daku');
      const btnAll = document.getElementById('category-all');

      [btnSei, btnDaku, btnAll].forEach(btn => {
        btn.className = "flex-1 py-1 rounded-md transition-all text-center text-slate-600 hover:text-slate-900";
      });

      if (cat === 'sei') btnSei.className = "flex-1 py-1 rounded-md transition-all text-center bg-white text-indigo-600 shadow-2xs font-black";
      if (cat === 'daku') btnDaku.className = "flex-1 py-1 rounded-md transition-all text-center bg-white text-indigo-600 shadow-2xs font-black";
      if (cat === 'all') btnAll.className = "flex-1 py-1 rounded-md transition-all text-center bg-white text-indigo-600 shadow-2xs font-black";

      nextQuestion();
    }

    window.onload = function() {
      initTokyoVoice();
      const ua = navigator.userAgent.toLowerCase();
      const isAppWebView = ua.includes('fban') || ua.includes('fbav') || ua.includes('line') || ua.includes('micromessenger');
      if (isAppWebView) {
        document.getElementById('env-warning').classList.remove('hidden');
      }

      document.body.addEventListener('touchstart', unlockAudioOniOS, { passive: false });
      document.body.addEventListener('click', unlockAudioOniOS, { passive: false });

      switchMode('B');
    };

    function unlockAudioOniOS() {
      if (ttsUnlocked) return;
      if (synth) {
        const dummyUtterance = new SpeechSynthesisUtterance('');
        dummyUtterance.volume = 1.0;
        synth.speak(dummyUtterance);
      }
      ttsUnlocked = true;
    }

    function switchMode(mode) {
      currentMode = mode;
      const btnB = document.getElementById('mode-b');
      const btnReview = document.getElementById('mode-review');

      if (mode === 'B') {
        btnB.className = "flex-1 py-1.5 rounded-lg transition-all duration-200 bg-white text-indigo-600 shadow-sm font-black";
        btnReview.className = "flex-1 py-1.5 rounded-lg transition-all duration-200 text-slate-500 hover:text-slate-800 flex items-center justify-center gap-1";
      } else {
        btnReview.className = "flex-1 py-1.5 rounded-lg transition-all duration-200 bg-white text-indigo-600 shadow-sm font-black flex items-center justify-center gap-1";
        btnB.className = "flex-1 py-1.5 rounded-lg transition-all duration-200 text-slate-500 hover:text-slate-800";
      }

      nextQuestion();
    }

    function nextQuestion() {
      isAnswered = false;
      document.getElementById('roma-display').classList.add('hidden');
      document.getElementById('feedback-text').innerText = '';

      const activeData = getActiveDataset();

      if (currentMode === 'REVIEW') {
        if (wrongQuestions.length === 0) {
          document.getElementById('prompt-text').innerText = '🎉 太棒了！目前沒有錯題需要複習！';
          document.getElementById('options-container').innerHTML = '';
          return;
        }
        const randomIndex = Math.floor(Math.random() * wrongQuestions.length);
        currentQuestion = wrongQuestions[randomIndex];
      } else {
        const randomIndex = Math.floor(Math.random() * activeData.length);
        currentQuestion = activeData[randomIndex];
      }

      document.getElementById('prompt-text').innerText = `請聽標準發音，選擇正確假名 (${currentQuestion.type === 'kata' ? '片假名' : '平假名'})`;

      // 產生 4 個選項
      let choices = [currentQuestion];
      let pool = activeData.filter(item => item.kana !== currentQuestion.kana);
      
      while (choices.length < 4 && pool.length > 0) {
        const randIdx = Math.floor(Math.random() * pool.length);
        choices.push(pool[randIdx]);
        pool.splice(randIdx, 1);
      }

      choices.sort(() => Math.random() - 0.5);

      const container = document.getElementById('options-container');
      container.innerHTML = '';
      choices.forEach(item => {
        const btn = document.createElement('button');
        btn.className = "py-2.5 px-2 bg-slate-50 hover:bg-indigo-50/60 text-slate-800 font-extrabold text-xl rounded-xl border border-slate-200 hover:border-indigo-300 transition-all active:scale-95 shadow-2xs cursor-pointer flex items-center justify-center";
        btn.innerText = item.kana;
        btn.onclick = () => checkAnswer(item, btn);
        container.appendChild(btn);
      });

      setTimeout(() => {
        playCurrentAudio();
      }, 300);
    }

    function playCurrentAudio() {
      if (!currentQuestion) return;
      
      if (synth) {
        synth.cancel();
        
        if (!selectedTokyoVoice) {
          initTokyoVoice();
        }

        const utterance = new SpeechSynthesisUtterance(currentQuestion.kana);
        utterance.lang = 'ja-JP';
        
        if (selectedTokyoVoice) {
          utterance.voice = selectedTokyoVoice;
        }
        
        // 微調標準語速與音調，獲得自然標準的東京腔單字音
        utterance.rate = 0.85;
        utterance.pitch = 1.0;
        
        synth.speak(utterance);
      }
    }

    function checkAnswer(selectedItem, btnElement) {
      if (isAnswered) return;
      isAnswered = true;

      totalCount++;

      const isCorrect = (selectedItem.kana === currentQuestion.kana);
      const feedback = document.getElementById('feedback-text');
      const romaDisplay = document.getElementById('roma-display');

      romaDisplay.innerText = `[ ${currentQuestion.roma} ]`;
      romaDisplay.classList.remove('hidden');

      if (isCorrect) {
        correctCount++;
        btnElement.classList.remove('bg-slate-50', 'border-slate-200');
        btnElement.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600', 'shadow-md');
        feedback.innerText = '⭕ 答對了！太棒了！';
        feedback.className = 'text-xs font-black text-emerald-600 animate-bounce';

        if (currentMode === 'REVIEW') {
          wrongQuestions = wrongQuestions.filter(q => q.kana !== currentQuestion.kana);
          updateReviewBadge();
        }
      } else {
        btnElement.classList.remove('bg-slate-50', 'border-slate-200');
        btnElement.classList.add('bg-rose-500', 'text-white', 'border-rose-600', 'shadow-md');
        feedback.innerText = `❌ 答錯了！正確答案是「${currentQuestion.kana}」`;
        feedback.className = 'text-xs font-black text-rose-500';

        if (!wrongQuestions.some(q => q.kana === currentQuestion.kana)) {
          wrongQuestions.push(currentQuestion);
          updateReviewBadge();
        }

        const buttons = document.getElementById('options-container').querySelectorAll('button');
        buttons.forEach(btn => {
          if (btn.innerText === currentQuestion.kana) {
            btn.classList.remove('bg-slate-50', 'border-slate-200');
            btn.classList.add('bg-emerald-100', 'text-emerald-800', 'border-emerald-400', 'font-black');
          }
        });
      }

      updateScoreBoard();
    }

    function updateScoreBoard() {
      document.getElementById('score-correct').innerText = correctCount;
      document.getElementById('score-total').innerText = totalCount;
      const acc = totalCount === 0 ? 0 : Math.round((correctCount / totalCount) * 100);
      document.getElementById('score-accuracy').innerText = `${acc}%`;
    }

    function updateReviewBadge() {
      document.getElementById('review-count').innerText = wrongQuestions.length;
    }
  </script>
</body>
</html>
